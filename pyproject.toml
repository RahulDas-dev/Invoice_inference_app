[project]
name = "doc-infer"
version = "4.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quart-cors>=0.8.0",
    "quart-uploads>=0.0.4",
    "quart==0.20.0",
    "pytz>=2025.2",
    "pydantic==2.11.4",
    "pydantic-settings>=2.9.1",
    "pydantic-ai-slim[bedrock,openai]>=0.2.4",
    "quart-schema>=0.22.0",
    "pypdfium2>=4.30.1",
    "pillow>=11.2.1",
]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.1.1",
    "ruff>=0.11.10",
]

[tool.ruff]
exclude = [
    ".ruff_cache",
    ".git",
    ".ipynb_checkpoints",
    ".venv",
    ".vscode",
    "notebooks"
]
extend-include = []
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
ignore = ["ANN204", "ANN401", "E731", "D", "DTZ005", "BLE001","B008", "CPY001","COM812", "ERA001", "EM101","EM102", "FA","FBT", "G004", "UP", "TRY", "PTH123","ISC001" ]
select = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
